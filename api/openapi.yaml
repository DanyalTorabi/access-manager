                    mask: "5"
                meta:
                  total: 1
                  offset: 0
                  limit: 20
                  sort: "group_id"
                  order: "asc"
        "400":
          description: Bad request (invalid pagination params)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "404":
          description: Domain or resource not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"

