  # ---------------------------------------------------------------------------
  # /api/v2 — title-based permission API
  # ---------------------------------------------------------------------------
  # V2 differs from V1 in permission-related endpoints only:
  #   • access_mask (numeric string) is replaced by permissions (title array)
  #   • POST /api/v2/.../access-types allows omitting `bit` (auto-allocated)
  # Domain, user, group, and resource CRUD are unchanged; use /api/v1 for those.
  # ---------------------------------------------------------------------------

  /api/v2/domains/{domainID}/access-types:
    get:
      summary: List access types (v2)
      description: Same as v1 — returns access types with their bit values.
      operationId: listAccessTypesV2
      tags: [V2 AccessTypes]
      parameters:
        - $ref: "#/components/parameters/domainID"
        - $ref: "#/components/parameters/limitParam"
        - $ref: "#/components/parameters/offsetParam"
        - $ref: "#/components/parameters/searchParam"
      responses:
        "200":
          description: Paginated list of access types
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/AccessType"
                  meta:
                    $ref: "#/components/schemas/ListMeta"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
    post:
      summary: Create access type (v2 — auto-allocates bit if omitted)
      operationId: createAccessTypeV2
      tags: [V2 AccessTypes]
      parameters:
        - $ref: "#/components/parameters/domainID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AccessTypeCreateBodyV2"
      responses:
        "201":
          description: Access type created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccessType"
        "400":
          description: Bad request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "409":
          description: Duplicate title or bit, or all 63 bits exhausted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "401":
          description: Unauthorized
          content:
            application/json:
