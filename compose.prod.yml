# compose.prod.yml — production-oriented override example for access-manager.
#
# Usage (from repo root):
#   docker compose -f docker-compose.yml -f compose.prod.yml up -d app
#
# This file shows production-safe overrides. It is NOT used by CI and is NOT
# a complete deployment spec — it illustrates the config knobs for operators.
#
# REQUIRED: set the following env vars before starting (do not commit real values):
#   DATABASE_URL        — postgres DSN (e.g. from a secret manager or .env.prod)
#   API_BEARER_TOKEN    — strong random token for /api/v1/* protection
#
# See docs/environments.md for the full environment tier matrix.

services:
  app:
    # Pin to a specific image SHA instead of 'latest' in production.
    # Replace <sha> with the SHA from the CI publish job.
    image: ghcr.io/danyaltorabi/access-manager:sha-<sha>

    # Remove tmpfs; use a named volume for durable SQLite (or switch to Postgres below).
    tmpfs: []
    volumes:
      - app-data:/data

    environment:
      # Bind on all interfaces; place a reverse proxy in front.
      HTTP_ADDR: "0.0.0.0:8080"

      # Set DATABASE_URL and DATABASE_DRIVER to match your production database.
      # Example: Postgres (recommended for production)
      DATABASE_DRIVER: "postgres"
      # DATABASE_URL is expected to come from the host environment or a secret manager.
      # DATABASE_URL: "postgres://user:password@db-host:5432/access_manager?sslmode=require"
      MIGRATIONS_DIR: "migrations/postgres"

      # Protect all /api/v1/* routes. Inject from a secret manager; do not hard-code.
      # API_BEARER_TOKEN: "<set-via-secret-manager>"

      # Disable in-process CORS headers when a reverse proxy manages CORS.
      CORS_ALLOWED_ORIGINS: "none"

      # Allow more time for graceful shutdown under load.
      SHUTDOWN_TIMEOUT_SECONDS: "60"

    # No loopback port binding — access via reverse proxy only.
    ports: []

    restart: unless-stopped

    # Minimal resource hints (adjust to your host).
    deploy:
      resources:
        limits:
          memory: 256M

volumes:
  app-data:
