{{- if .Values.postgres.enabled }}
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "access-manager.labels" . | nindent 4 }}
    app.kubernetes.io/component: postgres
spec:
  # Must reference the headless Service (clusterIP: None) for stable per-pod DNS.
  serviceName: postgres-headless
  replicas: 1
  selector:
    matchLabels:
      {{- include "access-manager.postgresSelectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "access-manager.postgresSelectorLabels" . | nindent 8 }}
    spec:
      # The official postgres image starts as root to initialise the data directory
      # then drops to UID 999 internally via su-exec. Do not set runAsNonRoot here.
      securityContext:
        fsGroup: 999
      containers:
        - name: postgres
          image: {{ .Values.postgres.image }}
          imagePullPolicy: IfNotPresent
          ports:
            - name: postgres
              containerPort: 5432
              protocol: TCP
          envFrom:
            - secretRef:
                name: {{ .Values.postgres.secretName }}
          readinessProbe:
            exec:
              command:
                - sh
                - -c
                - 'pg_isready -U "$POSTGRES_USER" -d "$POSTGRES_DB"'
            initialDelaySeconds: 5
            periodSeconds: 10
            failureThreshold: 5
            timeoutSeconds: 5
          livenessProbe:
            exec:
              command:
                - sh
                - -c
                - 'pg_isready -U "$POSTGRES_USER" -d "$POSTGRES_DB"'
            initialDelaySeconds: 15
            periodSeconds: 20
            failureThreshold: 3
            timeoutSeconds: 5
          resources:
            {{- toYaml .Values.postgres.resources | nindent 12 }}
          # postgres writes to its data directory so readOnlyRootFilesystem cannot be set.
          # Drop all capabilities and disallow privilege escalation at the container level.
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: postgres-data
              mountPath: /var/lib/postgresql/data
              subPath: pgdata
  volumeClaimTemplates:
    - metadata:
        name: postgres-data
      spec:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: {{ .Values.postgres.storage }}
{{- end }}
