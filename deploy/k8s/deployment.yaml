apiVersion: apps/v1
kind: Deployment
metadata:
  name: access-manager
  namespace: access-manager
  labels:
    app.kubernetes.io/name: access-manager
    app.kubernetes.io/component: server
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: access-manager
      app.kubernetes.io/component: server
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app.kubernetes.io/name: access-manager
        app.kubernetes.io/component: server
    spec:
      # Match Dockerfile: distroless nonroot UID/GID 65532.
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
      containers:
        - name: server
          image: ghcr.io/danyaltorabi/access-manager:latest
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          envFrom:
            - configMapRef:
                name: access-manager
          env:
            # Sensitive values come from Secrets; names match docs/environments.md.
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: access-manager-db
                  key: url
            - name: API_BEARER_TOKEN
              valueFrom:
                secretKeyRef:
                  name: access-manager-auth
                  key: token
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 15
            failureThreshold: 3
            timeoutSeconds: 3
          readinessProbe:
            # TODO(T21): replace with a dedicated /readyz endpoint that also pings
            # the database once that endpoint is added to the server.
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 3
            periodSeconds: 10
            failureThreshold: 3
            timeoutSeconds: 3
          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              cpu: "200m"
              memory: "128Mi"
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
      # TODO(T21): add a dedicated ServiceAccount with minimal RBAC instead of
      # relying on the default ServiceAccount.
      automountServiceAccountToken: false
