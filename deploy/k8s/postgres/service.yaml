apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: access-manager
  labels:
    app.kubernetes.io/name: access-manager
    app.kubernetes.io/component: postgres
spec:
  # ClusterIP (not headless) so the app can resolve postgres.access-manager.svc.cluster.local:5432.
  type: ClusterIP
  selector:
    app.kubernetes.io/name: access-manager
    app.kubernetes.io/component: postgres
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres
      protocol: TCP
